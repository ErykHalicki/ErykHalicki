<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#1e1e1e;overflow:hidden;font:12px -apple-system,system-ui,sans-serif}
#viewer{position:fixed;inset:0;overflow:auto}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;min-width:100%;width:max-content;box-sizing:border-box}
.page{position:relative;background:#fff;flex:none;box-shadow:0 1px 6px rgba(0,0,0,.5);overflow:hidden}
.page canvas{position:absolute;display:block}
.page canvas.base{inset:0;width:100%;height:100%}
.textLayer{position:absolute;left:0;top:0;transform-origin:0 0;line-height:1;--total-scale-factor:1;--min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor)*var(--min-font-size));--min-font-size-inv:calc(1/var(--min-font-size));-webkit-text-size-adjust:none;text-size-adjust:none;z-index:1}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer>:not(.markedContent),.textLayer .markedContent span:not(.markedContent){--font-height:0;font-size:calc(var(--text-scale-factor)*var(--font-height));--scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}
.textLayer .markedContent{display:contents}
.textLayer ::selection{background:rgba(0,100,255,.3);color:transparent}
.textLayer span.hit{background:rgba(255,210,0,.4)}
.textLayer span.cur{background:rgba(255,110,0,.7)}
a.link{position:absolute;z-index:2}
a.link:hover{background:rgba(0,120,255,.12)}
#hud{position:fixed;right:10px;bottom:8px;color:#bbb;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:4px;pointer-events:none}
#find{position:fixed;left:10px;bottom:8px;width:260px;font:13px -apple-system,system-ui,sans-serif;padding:4px 8px;border-radius:4px;border:1px solid #555;background:#2a2a2a;color:#eee;outline:none}
#status{position:fixed;inset:0;display:grid;place-items:center;color:#bbb;font-size:15px}
</style></head><body>
<div id="viewer"><div id="pages"></div></div>
<div id="hud"></div>
<input id="find" hidden placeholder="search (Enter next, Shift+Enter prev)">
<div id="status">If this text stays, JavaScript is not running in this browser.</div>
<script type="application/octet-stream" id="pdfdata">
